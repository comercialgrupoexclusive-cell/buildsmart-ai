name: BuildSmart V2 CI

on:
  pull_request:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"
  push:
    branches: [claude/buildsmartv2-g01-foundation-s17o1d]
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"

defaults:
  run:
    working-directory: v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v2/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
